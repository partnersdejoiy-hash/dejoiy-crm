name: Build Dejoiy CRM image

# Builds the Dejoiy-branded CRM image (frontend + server) on a GitHub-hosted
# runner — the portal server cannot fit the ~15 GB build — and pushes it to
# GHCR so the server can pull `ghcr.io/partnersdejoiy-hash/dejoiy-crm:latest`.

on:
  push:
    branches:
      - dejoiy/rebrand
      - dejoiy/main
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pull base images through Google's Docker Hub mirror — avoids Docker Hub
      # rate limits and needs no credentials (mirrors the upstream CI workflow).
      - name: Configure Docker Hub mirror
        run: |
          echo '{"registry-mirrors":["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          # `twenty` = server + frontend (external DB/Redis via env), matching
          # the upstream twentycrm/twenty image the compose file expects. The
          # default target would build the all-in-one dev image (internal DB).
          target: twenty
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # The runner has 7 GB RAM; the Dockerfile default (8 GB heap) would OOM.
          build-args: |
            FRONTEND_NODE_OPTIONS=--max-old-space-size=4096
          cache-from: type=gha
          cache-to: type=gha,mode=max
